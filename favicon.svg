    <!-- Right scale -->
    <circle cx="22" cy="12" r="2.5" fill="none" stroke-width="0.6"/>
    <line x1="19.5" y1="14.5" x2="24.5" y2="14.5" stroke-width="0.6"/>
    <!-- Base -->
