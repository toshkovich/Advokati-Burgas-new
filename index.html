<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Адвокатска кантора Бургас - Сливен | Правна защита и медиация</title>
  <link rel="stylesheet" href="style.css">
  <style>
  .hero-custom {
    text-align: center;
    background: linear-gradient(180deg,#f5f8ff 70%,#e4eeff 100%);
    padding: 70px 20px 55px 20px;
  }
  .hero-custom .hero-text h1 {
    font-size: 2.1em;
    font-weight: 700;
    color: #1e2955;
    letter-spacing: 0.01em;
    margin-bottom: 0.3em;
  }
  .hero-custom .hero-text .desc {
    display: block;
    font-size: 1.18em;
    margin-bottom: 1.6em;
    color: #4762a1;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .scales-animation {
    margin: 0 auto;
    width: 100%;
    max-width: 340px;
  }
  /* Допълнителен стил за по-"яка" анимация */
  .scales-floating {
    animation: floatScales 3.5s ease-in-out infinite;
    transform-origin: 180px 80px;
  }
  @keyframes floatScales {
    0% { transform: translateY(0) rotate(-8deg);}
    25% { transform: translateY(-8px) rotate(-3deg);}
    50% { transform: translateY(-15px) rotate(8deg);}
    75% { transform: translateY(-8px) rotate(-3deg);}
    100% { transform: translateY(0) rotate(-8deg);}
  }
  @media (max-width: 600px) {
    .hero-custom {
      padding: 35px 5px 25px 5px;
    }
    .hero-custom .hero-text h1 {
      font-size: 1.18em;
    }
    .scales-animation {
      max-width: 98vw;
    }
  }
  </style>
</head>
<body>
  <!-- Начален блок с вашето име и яка анимирана везна -->
  <section class="hero-custom">
    <div class="hero-text">
      <h1>Адвокатска кантора Бургас - Сливен</h1>
      <span class="desc">
        ПРАВНИ КОНСУЛТАЦИИ И ПРЕДСТАВИТЕЛСТВО ПРЕД СЪД, ПРОКУРАТУРА И ДОСЪДЕБНИ ОРГАНИ
      </span>
    </div>
    <div class="scales-animation">
      <!-- SVG анимация: яка, стилна, плаваща и люлееща се везна -->
      <svg viewBox="0 0 360 180" width="300" height="140" style="display:block;margin:0 auto;">
        <!-- Вълна (анимирана) -->
        <path id="wave" fill="#b3c6ff">
          <animate attributeName="d"
            dur="3s"
            repeatCount="indefinite"
            values="
              M0,120 Q60,100 120,120 T240,120 T360,120 V180 H0 Z;
              M0,120 Q60,130 120,120 T240,120 T360,120 V180 H0 Z;
              M0,120 Q60,100 120,120 T240,120 T360,120 V180 H0 Z
            "
          />
        </path>
        <!-- Везни (група с яка люлееща и плаваща анимация) -->
        <g class="scales-floating">
          <!-- Централен стълб -->
          <rect x="173" y="40" width="14" height="60" rx="7" fill="#1e2955"/>
          <!-- Горна греда със златист отблясък -->
          <rect x="150" y="60" width="60" height="8" rx="4" fill="#ffd700" stroke="#4762a1" stroke-width="1"/>
          <ellipse cx="180" cy="64" rx="8" ry="4" fill="#ffe399" opacity="0.8"/>
          <!-- Лява верига + чинийка с допълнителна анимация -->
          <g>
            <line x1="155" y1="64" x2="140" y2="100" stroke="#888" stroke-width="2"/>
            <ellipse cx="140" cy="108" rx="17" ry="7" fill="#ffe399">
              <animate attributeName="cy" values="108;115;108" dur="2.8s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse cx="140" cy="108" rx="10" ry="3" fill="#ffd700" opacity="0.55"/>
          </g>
          <!-- Дясна верига + чинийка с противоположна анимация -->
          <g>
            <line x1="205" y1="64" x2="220" y2="100" stroke="#888" stroke-width="2"/>
            <ellipse cx="220" cy="108" rx="17" ry="7" fill="#ffe399">
              <animate attributeName="cy" values="108;101;108" dur="2.8s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse cx="220" cy="108" rx="10" ry="3" fill="#ffd700" opacity="0.55"/>
          </g>
          <!-- Лек отблясък за усещане за движение -->
          <ellipse cx="180" cy="130" rx="70" ry="13" fill="#e0e7ff" opacity="0.35">
            <animate attributeName="rx" values="70;83;70" dur="3s" repeatCount="indefinite"/>
          </ellipse>
          <!-- Лека сянка под везните -->
          <ellipse cx="180" cy="140" rx="50" ry="8" fill="#b1b8cc" opacity="0.19"/>
        </g>
      </svg>
    </div>
  </section>

  <!-- Тук добави останалото си съдържание: услуги, екип, контакти и т.н. -->
</body>
</html>
